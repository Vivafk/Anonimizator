services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      network: host  # обход проблем DNS в build-сети на этом хосте
    container_name: anonymizer-app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
      - MAX_UPLOAD_MB=50
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: anonymizer-nginx
    ports:
      - "0.0.0.0:8082:443"
      - "[::]:8082:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_network:
    driver: bridge
